<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="addTabIndex()">
    <div id="image">Di chuột hoặc dùng phím Tab qua một hình ảnh bên dưới để hiển thị ở đây.</div>
    
    <img class="preview" alt="Styling with a Bandana" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="With My Boy" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.jpg" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Young Puppy" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Nature Walk" src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=200" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Playing Fetch" src="https://images.unsplash.com/photo-1537151608804-ea2f1fae1363?w=200" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Sleeping Dog" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <script src="script.js"></script>
</body>
</html>
